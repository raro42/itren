server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Lighthouse: compress text assets (JS was ~350KB raw without this).
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_vary on;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/ld+json
    application/xml
    image/svg+xml;

  # No unsafe-inline for scripts. Beasties boot script is externalized at build time.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # Brand icons: short cache (not immutable). Favicons change with rename; 7d immutable stuck the old “y”.
  location ~* ^/(?:itren|favicon)\.(?:svg|ico)$ {
    try_files $uri =404;
    expires 1d;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location ~* ^/(?:itren-180|apple-touch-icon|og-itren(?:-ca|-square)?)\.png$ {
    try_files $uri =404;
    expires 1d;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Hashed build assets: long cache. Missing file must 404 (never SPA fallback).
  location ~* \.(?:js|mjs|css|map|ttf|woff2?|ico|png|svg|webp|xml|txt)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  }

  # HTML must not stick with an old shell (causes phantom CSP + stale bundles).
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  }

  # Service worker must revalidate so updates land on the platform phone.
  location = /sw.js {
    try_files /sw.js =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  }

  location = /manifest.webmanifest {
    try_files /manifest.webmanifest =404;
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=3600";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location = /robots.txt {
    try_files /robots.txt =404;
    add_header Cache-Control "public, max-age=3600";
  }

  location = /sitemap.xml {
    try_files /sitemap.xml =404;
    add_header Cache-Control "public, max-age=3600";
    default_type application/xml;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  }

  location /api/ {
    proxy_pass http://yonose-api:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
}

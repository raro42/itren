services:
  yonose-api:
    container_name: yonose-api
    build:
      context: ./api
      dockerfile: Dockerfile
    image: yonose-api:local
    restart: unless-stopped
    environment:
      YONOSE_DATA_DIR: /data
      YONOSE_VERSION: ${YONOSE_VERSION:-0.1.0}
      YONOSE_COMMIT: ${YONOSE_COMMIT:-dev}
    volumes:
      - yonose_gtfs:/data
    ports:
      - "127.0.0.1:9091:8000"

  yonose-front:
    container_name: yonose-front
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        YONOSE_VERSION: ${YONOSE_VERSION:-0.1.0}
        YONOSE_COMMIT: ${YONOSE_COMMIT:-dev}
    image: yonose-front:local
    restart: unless-stopped
    depends_on:
      - yonose-api
    ports:
      - "127.0.0.1:9090:80"

volumes:
  yonose_gtfs:
